name: Serverless simulator CI

on:
  push:
    paths: ['functions/telemetry-simulator/**', '.github/workflows/ci-serverless.yml']
  pull_request:
    paths: ['functions/telemetry-simulator/**', '.github/workflows/ci-serverless.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: functions/telemetry-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Verify Azure Functions registration
        run: python -c "import function_app; assert len(function_app.app.get_functions()) == 1"
