name: ColdChain Kubernetes

# Valida los manifiestos en cada cambio: render de Kustomize y validación de
# esquema (kubeconform). La publicación de imágenes y el despliegue están en
# cd-gitops.yml.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'release/**']
    paths:
      - 'infrastructure/kubernetes/**'
      - 'infrastructure/argocd/**'
      - '.github/workflows/kubernetes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    name: Render and validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4
      - name: Render overlays
        run: |
          mkdir -p rendered
          for overlay in local dev prod cloud; do
            kubectl kustomize "infrastructure/kubernetes/overlays/$overlay" > "rendered/$overlay.yaml"
          done
          kubectl kustomize infrastructure/kubernetes/observability > rendered/observability.yaml
          kubectl kustomize infrastructure/argocd > rendered/argocd.yaml
      - name: Validate schemas (kubeconform)
        run: |
          docker run --rm -v "$PWD/rendered:/rendered:ro" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0 \
            /rendered/local.yaml /rendered/dev.yaml /rendered/prod.yaml /rendered/cloud.yaml /rendered/observability.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: kubernetes-manifests
          path: rendered/
          if-no-files-found: error
