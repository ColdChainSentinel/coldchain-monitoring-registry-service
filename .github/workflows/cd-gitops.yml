name: ColdChain CD (GitOps)

# Entrega continua con GitOps:
#  1. Cada push a develop construye las cinco imágenes, las publica en GHCR con el
#     SHA del commit, las escanea con Trivy y actualiza overlays/dev. Argo CD
#     sincroniza coldchain-dev automáticamente.
#  2. "promote" copia las etiquetas verificadas de dev a prod. Requiere la
#     aprobación del environment "production" (revisores obligatorios).
#  3. "rollback" fija prod en un SHA anterior ya publicado.
# Ninguna etapa usa credenciales del clúster: el estado deseado vive en Git.
on:
  push:
    branches: [develop]
    paths-ignore:
      - 'infrastructure/kubernetes/overlays/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      action:
        description: build (dev), promote (dev -> prod) o rollback (prod)
        type: choice
        options: [build, promote, rollback]
        default: build
      sha:
        description: Solo para rollback, SHA de 12 caracteres ya publicado
        required: false

permissions:
  contents: read

concurrency:
  group: cd-gitops
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/coldchainsentinel
  SERVICES: identity-access monitoring-registry telemetry-ingestion alert-management frontend

jobs:
  build:
    name: Build, scan and publish images
    if: github.event_name == 'push' || inputs.action == 'build'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build images
        run: |
          for service in $SERVICES; do
            context="services/$service"; [ "$service" = frontend ] && context=frontend
            docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "$REGISTRY/$service:${{ steps.tag.outputs.tag }}" "$context"
          done
      - name: Scan images (fail on fixable HIGH/CRITICAL)
        run: |
          for service in $SERVICES; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.70.0 image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --quiet \
              "$REGISTRY/$service:${{ steps.tag.outputs.tag }}"
          done
      - name: Publish to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for service in $SERVICES; do docker push "$REGISTRY/$service:${{ steps.tag.outputs.tag }}"; done

  deploy-dev:
    name: Update dev overlay (Argo CD syncs)
    needs: build
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Set image tags in overlays/dev
        run: scripts/cd/set-image-tag.sh infrastructure/kubernetes/overlays/dev "${{ needs.build.outputs.tag }}"
      - name: Commit desired state
        run: scripts/cd/commit-overlay.sh "deploy ${{ needs.build.outputs.tag }} to dev"

  promote:
    name: Promote dev -> prod
    if: inputs.action == 'promote'
    runs-on: ubuntu-latest
    # Requiere aprobación manual de un revisor del environment production.
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Copy verified tag from dev
        run: |
          tag=$(scripts/cd/current-tag.sh infrastructure/kubernetes/overlays/dev)
          scripts/cd/set-image-tag.sh infrastructure/kubernetes/overlays/prod "$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Commit desired state
        run: scripts/cd/commit-overlay.sh "promote $TAG to prod"

  rollback:
    name: Roll back prod
    if: inputs.action == 'rollback'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate target tag
        run: |
          echo "${{ inputs.sha }}" | grep -Eq '^[0-9a-f]{12}$' || { echo "SHA inválido"; exit 1; }
          for service in $SERVICES; do
            docker manifest inspect "$REGISTRY/$service:${{ inputs.sha }}" > /dev/null
          done
      - name: Set previous tag in overlays/prod
        run: scripts/cd/set-image-tag.sh infrastructure/kubernetes/overlays/prod "${{ inputs.sha }}"
      - name: Commit desired state
        run: scripts/cd/commit-overlay.sh "rollback prod to ${{ inputs.sha }}"
