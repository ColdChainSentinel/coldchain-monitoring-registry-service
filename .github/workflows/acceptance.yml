name: ColdChain Acceptance

on:
  push:
    paths:
      - 'services/**'
      - 'tests/integration/**'
      - 'tests/acceptance/**'
      - 'docs/hu04.feature'
      - '.github/workflows/acceptance.yml'
      - '.mvn/**'
      - 'mvnw*'
      - 'pom.xml'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'tests/integration/**'
      - 'tests/acceptance/**'
      - 'docs/hu04.feature'
      - '.github/workflows/acceptance.yml'
      - '.mvn/**'
      - 'mvnw*'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hu04:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Registry tests and HU-04 acceptance
        run: sh mvnw -B -ntp -pl services/monitoring-registry -Pacceptance clean verify
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hu04-acceptance-${{ github.run_number }}
          path: |
            services/monitoring-registry/target/cucumber/
            services/monitoring-registry/target/surefire-reports/
            services/monitoring-registry/target/site/jacoco/
          if-no-files-found: warn

  integrated-postgres:
    name: Integrated acceptance - PostgreSQL
    needs: hu04
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check Docker availability
        run: docker info > /dev/null
      - name: Verify and package the three services
        run: sh mvnw -B -ntp -Pacceptance clean verify
      - name: Real HTTP flow with disposable PostgreSQL
        run: sh mvnw -B -ntp -f tests/integration/pom.xml clean verify
      - name: Publish integrated acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-postgres-${{ github.run_number }}
          path: |
            tests/integration/target/cucumber/
            tests/integration/target/failsafe-reports/
            tests/integration/target/stack/*.log
            tests/integration/target/stack/environment.txt
          if-no-files-found: warn

  trivy:
    name: Security scan - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # Acciones de terceros fijadas por SHA: los tags pueden reescribirse.
      - name: Trivy report for code scanning
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: frontend/node_modules
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
      - name: Publish Trivy results to GitHub code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Fail on fixable HIGH or CRITICAL findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: frontend/node_modules
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'
          skip-setup-trivy: true

  sonar:
    name: Code quality - Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'ColdChainSentinel_coldchain-monitoring-registry-service' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Cache Sonar packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Missing Sonar configuration
        if: env.SONAR_TOKEN == ''
        run: echo "::warning title=Sonar no ejecutado::Falta el secreto SONAR_TOKEN; configurar SONAR_TOKEN y las variables SONAR_* del repositorio."
      # JaCoCo se añade por línea de comandos para medir cobertura en los tres servicios sin cambiar sus pom.
      - name: Build, test and analyze
        if: env.SONAR_TOKEN != ''
        run: |
          args=(-Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.projectKey="$SONAR_PROJECT_KEY" -Dsonar.qualitygate.wait=true)
          if [ -n "$SONAR_ORGANIZATION" ]; then args+=(-Dsonar.organization="$SONAR_ORGANIZATION"); fi
          sh mvnw -B -ntp -Pacceptance \
            org.jacoco:jacoco-maven-plugin:0.8.13:prepare-agent verify org.jacoco:jacoco-maven-plugin:0.8.13:report \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar "${args[@]}"
