apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coldchain-prod
  namespace: argocd
  labels:
    coldchain/environment: prod
spec:
  project: coldchain
  source:
    repoURL: https://github.com/ColdChainSentinel/coldchain-monitoring-registry-service.git
    # Rama de la entrega final; al fusionarse, cambiar a develop (dev) y main (prod).
    targetRevision: release/final-tb4
    path: infrastructure/kubernetes/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: coldchain-prod
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
