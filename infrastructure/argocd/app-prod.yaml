apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coldchain-prod
  namespace: argocd
  labels:
    coldchain/environment: prod
spec:
  project: coldchain
  source:
    repoURL: https://github.com/ColdChainSentinel/coldchain-monitoring-registry-service.git
    # Rama de la entrega final; al fusionarse, cambiar a develop (dev) y main (prod).
    targetRevision: release/final-tb4
    path: infrastructure/kubernetes/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: coldchain-prod
  revisionHistoryLimit: 10
  # Kubernetes completa campos por defecto en volumeClaimTemplates (status,
  # volumeMode); sin esto el StatefulSet aparece siempre OutOfSync.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
    # Las réplicas las decide el HPA; sin esto selfHeal las devolvía al valor de Git
    # en plena carga (detectado en la prueba de estrés de 4.4.3).
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
