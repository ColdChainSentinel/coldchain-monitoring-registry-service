apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: coldchain-local
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
components:
  - ../../components/postgres
images:
  - name: coldchain/identity-access
    newName: coldchain-k8s-identity-access
  - name: coldchain/monitoring-registry
    newName: coldchain-k8s-monitoring-registry
  - name: coldchain/telemetry-ingestion
    newName: coldchain-k8s-telemetry-ingestion
  - name: coldchain/alert-management
    newName: coldchain-k8s-alert-management
  - name: coldchain/frontend
    newName: coldchain-k8s-frontend
