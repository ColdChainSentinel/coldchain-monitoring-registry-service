# En la nube las credenciales de base salen del Secret sincronizado desde Key
# Vault; DB_URL de cada servicio está en patch-db-urls.yaml.
- op: replace
  path: /spec/template/spec/containers/0/envFrom
  value:
    - configMapRef:
        name: coldchain-observability
        optional: true
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: DB_USER
    value: coldchain
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: coldchain-postgres
        key: POSTGRES_PASSWORD
