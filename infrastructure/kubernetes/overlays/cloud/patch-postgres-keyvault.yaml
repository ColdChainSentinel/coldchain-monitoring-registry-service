# El volumen CSI es el que dispara la sincronización de los Secrets; PostgreSQL
# lo monta porque es el primer componente que los necesita.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  template:
    spec:
      containers:
        - name: postgres
          env:
            - name: POSTGRES_USER
              value: coldchain
          volumeMounts:
            - name: keyvault
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: keyvault
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: coldchain-keyvault
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: managed-csi
        resources:
          requests:
            storage: 8Gi
