# Sincroniza secretos de Azure Key Vault como Secrets de Kubernetes. Los valores
# los genera Terraform (random_password); tenant, vault e identidad salen de
# `terraform output` en infrastructure/terraform-aks.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: coldchain-keyvault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: CSI_IDENTITY_CLIENT_ID
    keyvaultName: KEY_VAULT_NAME
    tenantId: TENANT_ID
    objects: |
      array:
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: bootstrap-admin-password
          objectType: secret
  secretObjects:
    - secretName: coldchain-postgres
      type: Opaque
      data:
        - objectName: postgres-password
          key: POSTGRES_PASSWORD
    - secretName: identity-access-bootstrap
      type: Opaque
      data:
        - objectName: bootstrap-admin-password
          key: BOOTSTRAP_ADMIN_PASSWORD
