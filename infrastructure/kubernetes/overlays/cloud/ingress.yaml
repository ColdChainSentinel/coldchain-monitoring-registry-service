apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coldchain
spec:
  ingressClassName: replace-with-internal-class
  tls:
    - hosts: [coldchain.example.invalid]
      secretName: coldchain-tls
  rules:
    - host: coldchain.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
