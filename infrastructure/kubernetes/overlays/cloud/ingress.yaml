# Clase del add-on App Routing de AKS. El certificado TLS se guarda en Key Vault
# y se publica como Secret coldchain-tls (ver README, sección AKS).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coldchain
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts: [coldchain.example.com]
      secretName: coldchain-tls
  rules:
    - host: coldchain.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
