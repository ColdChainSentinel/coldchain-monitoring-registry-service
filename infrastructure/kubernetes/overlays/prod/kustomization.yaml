# Ambiente prod gestionado por Argo CD (GitOps). Las etiquetas de imagen son el SHA
# del commit que construyó cada imagen; el pipeline las actualiza solo al promover desde dev.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: coldchain-prod
labels:
  - pairs:
      coldchain/environment: prod
    includeSelectors: false
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
components:
  - ../../components/postgres
images:
  - name: coldchain/identity-access
    newName: ghcr.io/coldchainsentinel/identity-access
    newTag: dead00000001
  - name: coldchain/monitoring-registry
    newName: ghcr.io/coldchainsentinel/monitoring-registry
    newTag: dead00000001
  - name: coldchain/telemetry-ingestion
    newName: ghcr.io/coldchainsentinel/telemetry-ingestion
    newTag: dead00000001
  - name: coldchain/alert-management
    newName: ghcr.io/coldchainsentinel/alert-management
    newTag: dead00000001
  - name: coldchain/frontend
    newName: ghcr.io/coldchainsentinel/frontend
    newTag: dead00000001
replicas:
  - name: frontend
    count: 2
configMapGenerator:
  # Producción: sin Swagger UI ni OpenAPI publicados (superficie mínima, OWASP A05).
  - name: coldchain-observability
    behavior: merge
    literals:
      - SPRINGDOC_API_DOCS_ENABLED=false
      - SPRINGDOC_SWAGGER_UI_ENABLED=false
