apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-apps
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: coldchain
      ports:
        - port: 5432
