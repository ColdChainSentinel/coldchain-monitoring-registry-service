# Una ServiceAccount por microservicio: identidad propia, sin token montado
# (automountServiceAccountToken: false) porque ninguna app consulta la API de Kubernetes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity-access
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-registry
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: telemetry-ingestion
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-management
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
automountServiceAccountToken: false
---
# Rol de solo lectura para el equipo de desarrollo: diagnosticar sin modificar.
# No incluye Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coldchain-viewer
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, configmaps, events, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
---
# Rol de operación (guardia): además de leer, puede reiniciar y escalar
# Deployments durante un incidente (runbook). Los cambios de versión van por GitOps.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coldchain-operator
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, configmaps, events, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    verbs: [patch, update]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coldchain-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coldchain-viewer
subjects:
  # En AKS el grupo corresponde a un grupo de Microsoft Entra ID (object id).
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: coldchain-developers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coldchain-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coldchain-operator
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: coldchain-operators
