spring:
  application:
    name: monitoring-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coldchain}
    username: ${DB_USER:coldchain}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      export:
        enabled: ${OTLP_TRACING_ENABLED:false}
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
springdoc:
  swagger-ui:
    path: /swagger-ui.html
coldchain:
  auth:
    enabled: ${AUTH_ENABLED:true}
    identity-base-url: ${IDENTITY_BASE_URL:http://localhost:8083}
