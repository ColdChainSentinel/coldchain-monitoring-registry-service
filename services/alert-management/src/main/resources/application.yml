spring:
  application:
    name: alert-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coldchain_alerts}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8082}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
springdoc:
  swagger-ui:
    path: /swagger-ui.html
coldchain:
  clients:
    registry-base-url: ${REGISTRY_BASE_URL:http://localhost:8080}
    connect-timeout: ${HTTP_CONNECT_TIMEOUT:2s}
    read-timeout: ${HTTP_READ_TIMEOUT:5s}
