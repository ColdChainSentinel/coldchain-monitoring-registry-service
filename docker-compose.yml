# ====================================================================
# ColdChain Sentinel - Orquestación Local de Microservicios y Frontend
# Final Project - Agile Software Factories (Semana 10 / TB3)
# ====================================================================

services:
  # ------------------------------------------------------------------
  # Base de Datos Relacional PostgreSQL 16
  # Aloja tres bases de datos lógicas: coldchain, coldchain_telemetry y coldchain_alerts
  # El script de init solo corre con el volumen vacío: tras cambios en él,
  # recrear con 'docker compose down -v'.
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: coldchain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coldchain
      POSTGRES_USER: ${DB_USER:-coldchain}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-coldchain123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-coldchain} -d coldchain"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - coldchain-network

  # ------------------------------------------------------------------
  # Microservicio 1: Monitoring Registry (Core Domain)
  # Puerto interno: 8080 | Healthcheck: /actuator/health
  # ------------------------------------------------------------------
  monitoring-registry:
    build:
      context: ./services/monitoring-registry
      dockerfile: Dockerfile
    container_name: coldchain-monitoring-registry
    restart: unless-stopped
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/coldchain
      DB_USER: ${DB_USER:-coldchain}
      DB_PASSWORD: ${DB_PASSWORD:-coldchain123}
    ports:
      - "${REGISTRY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - coldchain-network

  # ------------------------------------------------------------------
  # Microservicio 2: Telemetry Ingestion (Ingesta de Sensores)
  # Puerto interno: 8081 | Healthcheck: /actuator/health
  # ------------------------------------------------------------------
  telemetry-ingestion:
    build:
      context: ./services/telemetry-ingestion
      dockerfile: Dockerfile
    container_name: coldchain-telemetry-ingestion
    restart: unless-stopped
    environment:
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/coldchain_telemetry
      DB_USER: ${DB_USER:-coldchain}
      DB_PASSWORD: ${DB_PASSWORD:-coldchain123}
      REGISTRY_BASE_URL: http://monitoring-registry:8080
      ALERTS_BASE_URL: http://alert-management:8082
    ports:
      - "${TELEMETRY_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      monitoring-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - coldchain-network

  # ------------------------------------------------------------------
  # Microservicio 3: Alert Management (Evaluación de Reglas Térmicas)
  # Puerto interno: 8082 | Healthcheck: /actuator/health
  # Reglas térmicas por UUID: ./config/alerts/thermal-rules.yml (ignorado
  # por Git; plantilla en thermal-rules.example.yml). Sin ese archivo el
  # servicio arranca, pero evaluar un punto devuelve 422
  # THERMAL_RULE_NOT_CONFIGURED y Telemetry marca RULE_NOT_CONFIGURED.
  # ------------------------------------------------------------------
  alert-management:
    build:
      context: ./services/alert-management
      dockerfile: Dockerfile
    container_name: coldchain-alert-management
    restart: unless-stopped
    environment:
      PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/coldchain_alerts
      DB_USER: ${DB_USER:-coldchain}
      DB_PASSWORD: ${DB_PASSWORD:-coldchain123}
      REGISTRY_BASE_URL: http://monitoring-registry:8080
      # 'optional:' solo para el entorno local de Compose: permite arrancar
      # antes de conocer el UUID real del punto. En entornos desplegados
      # usar ruta obligatoria (sin 'optional:'), como indica el README de Alerts.
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/app/config/thermal-rules.yml
    volumes:
      - ./config/alerts:/app/config:ro
    ports:
      - "${ALERTS_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      monitoring-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - coldchain-network

  # ------------------------------------------------------------------
  # Cliente Web: Frontend SPA (React 19 + TypeScript + Vite en Nginx)
  # Puerto expuesto: 80 -> 8080 del contenedor sin root | Conecta mediante reverse proxy a los backends
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coldchain-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      monitoring-registry:
        condition: service_healthy
      telemetry-ingestion:
        condition: service_healthy
      alert-management:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - coldchain-network

  # ------------------------------------------------------------------
  # Simulador de Telemetría (OPCIONAL - perfil "simulator")
  # En la nube es una Azure Function (Timer Trigger); aquí se ejecuta
  # simulator.py en bucle para demos. NO se levanta con 'docker compose up'.
  # Uso: docker compose --profile simulator up -d
  # Requiere SIMULATOR_POINT_ID = UUID real registrado en Registry.
  # ------------------------------------------------------------------
  telemetry-simulator:
    build:
      context: ./functions/telemetry-simulator
      dockerfile: Dockerfile
    container_name: coldchain-telemetry-simulator
    restart: unless-stopped
    profiles: ["simulator"]
    environment:
      TELEMETRY_BASE_URL: http://telemetry-ingestion:8081
      MONITORING_POINT_ID: ${SIMULATOR_POINT_ID:-}
      SIMULATED_TEMPERATURE: ${SIMULATED_TEMPERATURE:-5}
      SIMULATOR_DRY_RUN: ${SIMULATOR_DRY_RUN:-true}
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-60}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-5}
    depends_on:
      telemetry-ingestion:
        condition: service_healthy
    networks:
      - coldchain-network

# --------------------------------------------------------------------
# Volúmenes y Redes
# --------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local

networks:
  coldchain-network:
    driver: bridge
